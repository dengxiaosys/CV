      <rect x="18" y="48" width="72" height="58" rx="6" fill="#7c3aed"/><rect x="104" y="48" width="72" height="58" rx="6" fill="#6d28d9"/>
      <text x="54" y="82" text-anchor="middle" class="cell">TP 0</text><text x="140" y="82" text-anchor="middle" class="cell">TP 1</text>
      <text x="97" y="31" text-anchor="middle" class="small">Blocks + LM Head</text>
    </g>
