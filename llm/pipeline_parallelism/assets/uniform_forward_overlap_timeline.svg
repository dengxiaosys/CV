<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
  <defs>
    <style>
      .title { font: 700 25px Inter, "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .heading { font: 700 19px Inter, "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .body { font: 500 16px Inter, "Noto Sans CJK SC", sans-serif; fill: #344054; }
      .small { font: 500 13px Inter, "Noto Sans CJK SC", sans-serif; fill: #475467; }
      .cell { font: 700 14px Inter, "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1500" height="650" fill="#ffffff"/>
  <text x="45" y="42" class="title">均匀 forward pipeline：K=4，M=5，且 S ≤ C</text>
  <text x="45" y="70" class="body">Compute block 宽度严格为 C；相邻 stage 之间的 activation P2P block 宽度严格为 S。</text>

  <line x1="100" y1="92" x2="1460" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1465" y="97" class="small">time</text>

  <text x="18" y="143" class="heading">stage 0</text>
  <rect x="100" y="112" width="150" height="48" rx="6" fill="#2563eb"/><text x="175" y="142" text-anchor="middle" class="cell">F₀,₀</text>
  <rect x="250" y="112" width="150" height="48" rx="6" fill="#2563eb"/><text x="325" y="142" text-anchor="middle" class="cell">F₀,₁</text>
  <rect x="400" y="112" width="150" height="48" rx="6" fill="#2563eb"/><text x="475" y="142" text-anchor="middle" class="cell">F₀,₂</text>
  <rect x="550" y="112" width="150" height="48" rx="6" fill="#2563eb"/><text x="625" y="142" text-anchor="middle" class="cell">F₀,₃</text>
  <rect x="700" y="112" width="150" height="48" rx="6" fill="#2563eb"/><text x="775" y="142" text-anchor="middle" class="cell">F₀,₄</text>

  <g fill="#0891b2">
    <rect x="250" y="172" width="50" height="30" rx="5"/><rect x="400" y="172" width="50" height="30" rx="5"/>
    <rect x="550" y="172" width="50" height="30" rx="5"/><rect x="700" y="172" width="50" height="30" rx="5"/>
    <rect x="850" y="172" width="50" height="30" rx="5"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="275" y="193">h₀⁽⁰⁾</text><text x="425" y="193">h₁⁽⁰⁾</text><text x="575" y="193">h₂⁽⁰⁾</text>
    <text x="725" y="193">h₃⁽⁰⁾</text><text x="875" y="193">h₄⁽⁰⁾</text>
  </g>

  <text x="18" y="241" class="heading">stage 1</text>
  <rect x="300" y="210" width="150" height="48" rx="6" fill="#16a34a"/><text x="375" y="240" text-anchor="middle" class="cell">F₁,₀</text>
  <rect x="450" y="210" width="150" height="48" rx="6" fill="#16a34a"/><text x="525" y="240" text-anchor="middle" class="cell">F₁,₁</text>
  <rect x="600" y="210" width="150" height="48" rx="6" fill="#16a34a"/><text x="675" y="240" text-anchor="middle" class="cell">F₁,₂</text>
  <rect x="750" y="210" width="150" height="48" rx="6" fill="#16a34a"/><text x="825" y="240" text-anchor="middle" class="cell">F₁,₃</text>
  <rect x="900" y="210" width="150" height="48" rx="6" fill="#16a34a"/><text x="975" y="240" text-anchor="middle" class="cell">F₁,₄</text>

  <g fill="#0891b2">
    <rect x="450" y="270" width="50" height="30" rx="5"/><rect x="600" y="270" width="50" height="30" rx="5"/>
    <rect x="750" y="270" width="50" height="30" rx="5"/><rect x="900" y="270" width="50" height="30" rx="5"/>
    <rect x="1050" y="270" width="50" height="30" rx="5"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="475" y="291">h₀⁽¹⁾</text><text x="625" y="291">h₁⁽¹⁾</text><text x="775" y="291">h₂⁽¹⁾</text>
    <text x="925" y="291">h₃⁽¹⁾</text><text x="1075" y="291">h₄⁽¹⁾</text>
  </g>

  <text x="18" y="339" class="heading">stage 2</text>
  <rect x="500" y="308" width="150" height="48" rx="6" fill="#ea580c"/><text x="575" y="338" text-anchor="middle" class="cell">F₂,₀</text>
  <rect x="650" y="308" width="150" height="48" rx="6" fill="#ea580c"/><text x="725" y="338" text-anchor="middle" class="cell">F₂,₁</text>
  <rect x="800" y="308" width="150" height="48" rx="6" fill="#ea580c"/><text x="875" y="338" text-anchor="middle" class="cell">F₂,₂</text>
  <rect x="950" y="308" width="150" height="48" rx="6" fill="#ea580c"/><text x="1025" y="338" text-anchor="middle" class="cell">F₂,₃</text>
  <rect x="1100" y="308" width="150" height="48" rx="6" fill="#ea580c"/><text x="1175" y="338" text-anchor="middle" class="cell">F₂,₄</text>

  <g fill="#0891b2">
    <rect x="650" y="368" width="50" height="30" rx="5"/><rect x="800" y="368" width="50" height="30" rx="5"/>
    <rect x="950" y="368" width="50" height="30" rx="5"/><rect x="1100" y="368" width="50" height="30" rx="5"/>
    <rect x="1250" y="368" width="50" height="30" rx="5"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="675" y="389">h₀⁽²⁾</text><text x="825" y="389">h₁⁽²⁾</text><text x="975" y="389">h₂⁽²⁾</text>
    <text x="1125" y="389">h₃⁽²⁾</text><text x="1275" y="389">h₄⁽²⁾</text>
  </g>

  <text x="18" y="437" class="heading">stage 3</text>
  <rect x="700" y="406" width="150" height="48" rx="6" fill="#7c3aed"/><text x="775" y="436" text-anchor="middle" class="cell">F₃,₀</text>
  <rect x="850" y="406" width="150" height="48" rx="6" fill="#7c3aed"/><text x="925" y="436" text-anchor="middle" class="cell">F₃,₁</text>
  <rect x="1000" y="406" width="150" height="48" rx="6" fill="#7c3aed"/><text x="1075" y="436" text-anchor="middle" class="cell">F₃,₂</text>
  <rect x="1150" y="406" width="150" height="48" rx="6" fill="#7c3aed"/><text x="1225" y="436" text-anchor="middle" class="cell">F₃,₃</text>
  <rect x="1300" y="406" width="150" height="48" rx="6" fill="#7c3aed"/><text x="1375" y="436" text-anchor="middle" class="cell">F₃,₄</text>

  <g stroke="#d0d5dd" stroke-width="1.3" stroke-dasharray="5 5">
    <line x1="100" y1="100" x2="100" y2="470"/><line x1="250" y1="100" x2="250" y2="470"/>
    <line x1="300" y1="100" x2="300" y2="470"/><line x1="450" y1="100" x2="450" y2="470"/>
    <line x1="500" y1="100" x2="500" y2="470"/><line x1="650" y1="100" x2="650" y2="470"/>
    <line x1="700" y1="100" x2="700" y2="470"/>
  </g>

  <path d="M100 494H250" stroke="#2563eb" stroke-width="3"/>
  <path d="M100 494l10-6v12z M250 494l-10-6v12z" fill="#2563eb"/>
  <text x="175" y="519" text-anchor="middle" class="heading" fill="#1d4ed8">C</text>

  <path d="M250 538H300" stroke="#0891b2" stroke-width="3"/>
  <path d="M250 538l10-6v12z M300 538l-10-6v12z" fill="#0891b2"/>
  <text x="275" y="564" text-anchor="middle" class="heading" fill="#0e7490">S</text>

  <rect x="380" y="482" width="980" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="404" y="514" class="body">Stage 1 计算 F₁,₀ 时，stage 0 计算 F₀,₁，并在其末尾发送 h₁⁽⁰⁾。</text>
  <text x="404" y="543" class="body">因为 S ≤ C，h₁⁽⁰⁾ 在 F₁,₀ 结束前完成传输，stage 1 可立即开始 F₁,₁。</text>
  <text x="404" y="566" class="small">Activation block 位于相邻 stage 之间，不单独占用 pipeline row。</text>

  <text x="750" y="622" text-anchor="middle" class="body">Steady-state initiation interval：D = C；第一条 microbatch 的端到端 latency 仍包含 4 个 C 与 3 个 S。</text>
</svg>
