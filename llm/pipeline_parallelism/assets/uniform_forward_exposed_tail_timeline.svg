<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
  <defs>
    <style>
      .title { font: 700 25px Inter, "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .heading { font: 700 19px Inter, "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .body { font: 500 16px Inter, "Noto Sans CJK SC", sans-serif; fill: #344054; }
      .small { font: 500 13px Inter, "Noto Sans CJK SC", sans-serif; fill: #475467; }
      .cell { font: 700 14px Inter, "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1500" height="650" fill="#ffffff"/>
  <text x="45" y="42" class="title">均匀 forward pipeline：K=4，M=5，且 S &gt; C</text>
  <text x="45" y="70" class="body">Compute block 宽度为 C；activation P2P block 宽度为 S；灰色间隙宽度为 S−C。</text>

  <line x1="60" y1="92" x2="1470" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1473" y="97" class="small">time</text>

  <text x="50" y="143" text-anchor="end" class="heading">stage 0</text>
  <g fill="#2563eb">
    <rect x="60" y="112" width="110" height="48" rx="6"/><rect x="200" y="112" width="110" height="48" rx="6"/>
    <rect x="340" y="112" width="110" height="48" rx="6"/><rect x="480" y="112" width="110" height="48" rx="6"/>
    <rect x="620" y="112" width="110" height="48" rx="6"/>
  </g>
  <g fill="#e2e8f0" stroke="#94a3b8">
    <rect x="170" y="112" width="30" height="48"/><rect x="310" y="112" width="30" height="48"/>
    <rect x="450" y="112" width="30" height="48"/><rect x="590" y="112" width="30" height="48"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="115" y="142">F₀,₀</text><text x="255" y="142">F₀,₁</text><text x="395" y="142">F₀,₂</text>
    <text x="535" y="142">F₀,₃</text><text x="675" y="142">F₀,₄</text>
  </g>

  <g fill="#0891b2">
    <rect x="170" y="172" width="140" height="30" rx="5"/><rect x="310" y="172" width="140" height="30" rx="5"/>
    <rect x="450" y="172" width="140" height="30" rx="5"/><rect x="590" y="172" width="140" height="30" rx="5"/>
    <rect x="730" y="172" width="140" height="30" rx="5"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="240" y="193">h₀⁽⁰⁾</text><text x="380" y="193">h₁⁽⁰⁾</text><text x="520" y="193">h₂⁽⁰⁾</text>
    <text x="660" y="193">h₃⁽⁰⁾</text><text x="800" y="193">h₄⁽⁰⁾</text>
  </g>

  <text x="50" y="241" text-anchor="end" class="heading">stage 1</text>
  <g fill="#16a34a">
    <rect x="310" y="210" width="110" height="48" rx="6"/><rect x="450" y="210" width="110" height="48" rx="6"/>
    <rect x="590" y="210" width="110" height="48" rx="6"/><rect x="730" y="210" width="110" height="48" rx="6"/>
    <rect x="870" y="210" width="110" height="48" rx="6"/>
  </g>
  <g fill="#e2e8f0" stroke="#94a3b8">
    <rect x="420" y="210" width="30" height="48"/><rect x="560" y="210" width="30" height="48"/>
    <rect x="700" y="210" width="30" height="48"/><rect x="840" y="210" width="30" height="48"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="365" y="240">F₁,₀</text><text x="505" y="240">F₁,₁</text><text x="645" y="240">F₁,₂</text>
    <text x="785" y="240">F₁,₃</text><text x="925" y="240">F₁,₄</text>
  </g>

  <g fill="#0891b2">
    <rect x="420" y="270" width="140" height="30" rx="5"/><rect x="560" y="270" width="140" height="30" rx="5"/>
    <rect x="700" y="270" width="140" height="30" rx="5"/><rect x="840" y="270" width="140" height="30" rx="5"/>
    <rect x="980" y="270" width="140" height="30" rx="5"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="490" y="291">h₀⁽¹⁾</text><text x="630" y="291">h₁⁽¹⁾</text><text x="770" y="291">h₂⁽¹⁾</text>
    <text x="910" y="291">h₃⁽¹⁾</text><text x="1050" y="291">h₄⁽¹⁾</text>
  </g>

  <text x="50" y="339" text-anchor="end" class="heading">stage 2</text>
  <g fill="#ea580c">
    <rect x="560" y="308" width="110" height="48" rx="6"/><rect x="700" y="308" width="110" height="48" rx="6"/>
    <rect x="840" y="308" width="110" height="48" rx="6"/><rect x="980" y="308" width="110" height="48" rx="6"/>
    <rect x="1120" y="308" width="110" height="48" rx="6"/>
  </g>
  <g fill="#e2e8f0" stroke="#94a3b8">
    <rect x="670" y="308" width="30" height="48"/><rect x="810" y="308" width="30" height="48"/>
    <rect x="950" y="308" width="30" height="48"/><rect x="1090" y="308" width="30" height="48"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="615" y="338">F₂,₀</text><text x="755" y="338">F₂,₁</text><text x="895" y="338">F₂,₂</text>
    <text x="1035" y="338">F₂,₃</text><text x="1175" y="338">F₂,₄</text>
  </g>

  <g fill="#0891b2">
    <rect x="670" y="368" width="140" height="30" rx="5"/><rect x="810" y="368" width="140" height="30" rx="5"/>
    <rect x="950" y="368" width="140" height="30" rx="5"/><rect x="1090" y="368" width="140" height="30" rx="5"/>
    <rect x="1230" y="368" width="140" height="30" rx="5"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="740" y="389">h₀⁽²⁾</text><text x="880" y="389">h₁⁽²⁾</text><text x="1020" y="389">h₂⁽²⁾</text>
    <text x="1160" y="389">h₃⁽²⁾</text><text x="1300" y="389">h₄⁽²⁾</text>
  </g>

  <text x="50" y="437" text-anchor="end" class="heading">stage 3</text>
  <g fill="#7c3aed">
    <rect x="810" y="406" width="110" height="48" rx="6"/><rect x="950" y="406" width="110" height="48" rx="6"/>
    <rect x="1090" y="406" width="110" height="48" rx="6"/><rect x="1230" y="406" width="110" height="48" rx="6"/>
    <rect x="1370" y="406" width="110" height="48" rx="6"/>
  </g>
  <g fill="#e2e8f0" stroke="#94a3b8">
    <rect x="920" y="406" width="30" height="48"/><rect x="1060" y="406" width="30" height="48"/>
    <rect x="1200" y="406" width="30" height="48"/><rect x="1340" y="406" width="30" height="48"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="865" y="436">F₃,₀</text><text x="1005" y="436">F₃,₁</text><text x="1145" y="436">F₃,₂</text>
    <text x="1285" y="436">F₃,₃</text><text x="1425" y="436">F₃,₄</text>
  </g>

  <path d="M60 494H170" stroke="#2563eb" stroke-width="3"/>
  <path d="M60 494l10-6v12z M170 494l-10-6v12z" fill="#2563eb"/>
  <text x="115" y="519" text-anchor="middle" class="heading" fill="#1d4ed8">C</text>

  <path d="M170 538H310" stroke="#0891b2" stroke-width="3"/>
  <path d="M170 538l10-6v12z M310 538l-10-6v12z" fill="#0891b2"/>
  <text x="240" y="564" text-anchor="middle" class="heading" fill="#0e7490">S</text>

  <path d="M170 582H200" stroke="#64748b" stroke-width="3"/>
  <path d="M170 582l8-5v10z M200 582l-8-5v10z" fill="#64748b"/>
  <text x="185" y="608" text-anchor="middle" class="small">S−C</text>

  <rect x="360" y="482" width="1000" height="104" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="384" y="514" class="body">Stage 1 的 F₁,₀ 在 x=310+ C 时结束，但 h₁⁽⁰⁾ 要到 x=310+ S 才到达。</text>
  <text x="384" y="543" class="body">因为 S &gt; C，stage 1 必须等待 S−C，随后才能开始 F₁,₁；每个 steady-state slot 都为 D=S。</text>
  <text x="384" y="568" class="small">Compute 与 P2P 仍有 C 的 overlap，但通信尾部无法被隐藏。</text>

  <text x="750" y="632" text-anchor="middle" class="body">Steady-state initiation interval：D = S；第一条 microbatch 的端到端 latency 仍包含 4 个 C 与 3 个 S。</text>
</svg>
