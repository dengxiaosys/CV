<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Context Parallelism sequence sharding</title>
  <desc id="desc">A long sequence is split across four ranks. Each rank keeps its query and output shard while KV-cache shards circulate between ranks.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1280" height="600" fill="#f8fafc"/>
  <text x="52" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Context Parallelism: split the context dimension</text>
  <text x="52" y="86" font-family="Arial, sans-serif" font-size="17" fill="#475569">Weights are replicated across CP ranks; sequence activations and the persistent KV cache are sharded.</text>
  <text x="52" y="136" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">Global token sequence, length S</text>
  <g transform="translate(52,154)" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="0" y="0" width="294" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="294" y="0" width="294" height="54" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="588" y="0" width="294" height="54" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="882" y="0" width="294" height="54" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="147" y="34" text-anchor="middle" fill="#1e40af">tokens 0 ... S/4 - 1</text><text x="441" y="34" text-anchor="middle" fill="#166534">tokens S/4 ... S/2 - 1</text><text x="735" y="34" text-anchor="middle" fill="#92400e">tokens S/2 ... 3S/4 - 1</text><text x="1029" y="34" text-anchor="middle" fill="#991b1b">tokens 3S/4 ... S - 1</text>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M199 216 L199 258"/><path d="M493 216 L493 258"/><path d="M787 216 L787 258"/><path d="M1081 216 L1081 258"/></g>
  <g font-family="Arial, sans-serif">
    <g transform="translate(52,266)"><rect width="294" height="218" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/><path d="M8 0 H286 Q294 0 294 8 V44 H0 V8 Q0 0 8 0" fill="#2563eb"/><text x="147" y="29" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CP rank 0</text><text x="20" y="80" font-size="17" font-weight="700" fill="#1e40af">Resident</text><text x="20" y="108" font-size="16" fill="#334155">local x, Q, KV-cache shard</text><text x="20" y="146" font-size="17" font-weight="700" fill="#1e40af">Local work</text><text x="20" y="174" font-size="16" fill="#334155">projection, MLP, norm</text><text x="20" y="202" font-size="16" fill="#334155">partial exact attention</text></g>
    <g transform="translate(346,266)"><rect width="294" height="218" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect width="294" height="44" fill="#16a34a"/><text x="147" y="29" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CP rank 1</text><text x="20" y="80" font-size="17" font-weight="700" fill="#166534">Resident</text><text x="20" y="108" font-size="16" fill="#334155">local x, Q, KV-cache shard</text><text x="20" y="146" font-size="17" font-weight="700" fill="#166534">Local work</text><text x="20" y="174" font-size="16" fill="#334155">projection, MLP, norm</text><text x="20" y="202" font-size="16" fill="#334155">partial exact attention</text></g>
    <g transform="translate(640,266)"><rect width="294" height="218" fill="#fff" stroke="#d97706" stroke-width="2"/><rect width="294" height="44" fill="#d97706"/><text x="147" y="29" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CP rank 2</text><text x="20" y="80" font-size="17" font-weight="700" fill="#92400e">Resident</text><text x="20" y="108" font-size="16" fill="#334155">local x, Q, KV-cache shard</text><text x="20" y="146" font-size="17" font-weight="700" fill="#92400e">Local work</text><text x="20" y="174" font-size="16" fill="#334155">projection, MLP, norm</text><text x="20" y="202" font-size="16" fill="#334155">partial exact attention</text></g>
    <g transform="translate(934,266)"><rect width="294" height="218" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M0 0 H286 Q294 0 294 8 V44 H0 Z" fill="#dc2626"/><text x="147" y="29" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CP rank 3</text><text x="20" y="80" font-size="17" font-weight="700" fill="#991b1b">Resident</text><text x="20" y="108" font-size="16" fill="#334155">local x, Q, KV-cache shard</text><text x="20" y="146" font-size="17" font-weight="700" fill="#991b1b">Local work</text><text x="20" y="174" font-size="16" fill="#334155">projection, MLP, norm</text><text x="20" y="202" font-size="16" fill="#334155">partial exact attention</text></g>
  </g>
  <path d="M199 508 C199 572,1081 572,1081 508" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><path d="M1081 496 C1081 540,199 540,199 496" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="402" y="526" width="476" height="46" rx="6" fill="#e2e8f0"/><text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Baseline CP: keep Q local; circulate KV shards</text>
</svg>
