<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Exact merge of partial attention outputs</title>
  <desc id="desc">Two KV shards independently produce a partial attention output and a log-sum-exp statistic. The statistics rescale both outputs before an exact merge.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1280" height="560" fill="#f8fafc"/>
  <text x="50" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Online softmax: why blockwise and distributed attention remain exact</text>
  <text x="50" y="84" font-family="Arial, sans-serif" font-size="17" fill="#475569">Each KV shard returns an output vector plus its softmax normalization statistic; the merge reconstructs global attention.</text>

  <g font-family="Arial, sans-serif">
    <rect x="54" y="150" width="170" height="76" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="139" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">query q</text><text x="139" y="208" text-anchor="middle" font-size="16" fill="#475569">fixed column vector</text>
    <path d="M224 188 H315" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="326" y="116" width="260" height="144" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="456" y="151" text-anchor="middle" font-size="20" font-weight="700" fill="#1e40af">partial attention 0</text>
    <text x="456" y="185" text-anchor="middle" font-size="17" fill="#334155">keys K0, values V0</text>
    <text x="456" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">returns (o0, LSE0)</text>

    <rect x="326" y="304" width="260" height="144" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="456" y="339" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">partial attention 1</text>
    <text x="456" y="373" text-anchor="middle" font-size="17" fill="#334155">keys K1, values V1</text>
    <text x="456" y="408" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">returns (o1, LSE1)</text>
    <path d="M224 188 C275 188,273 376,315 376" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

    <path d="M586 188 H680" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M586 376 H680" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="692" y="154" width="340" height="258" rx="8" fill="#fff" stroke="#d97706" stroke-width="2"/>
    <text x="862" y="191" text-anchor="middle" font-size="21" font-weight="700" fill="#92400e">numerically stable merge</text>
    <text x="716" y="235" font-size="17" fill="#334155">m = max(LSE0, LSE1)</text>
    <text x="716" y="276" font-size="17" fill="#334155">w0 = exp(LSE0 - m)</text>
    <text x="716" y="311" font-size="17" fill="#334155">w1 = exp(LSE1 - m)</text>
    <rect x="716" y="339" width="292" height="48" rx="6" fill="#fef3c7"/>
    <text x="862" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">o = (w0 o0 + w1 o1) / (w0 + w1)</text>

    <path d="M1032 283 H1111" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1122" y="226" width="108" height="114" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1176" y="269" text-anchor="middle" font-size="21" font-weight="700" fill="#991b1b">exact o</text>
    <text x="1176" y="300" text-anchor="middle" font-size="16" fill="#475569">same as</text>
    <text x="1176" y="326" text-anchor="middle" font-size="16" fill="#475569">full KV</text>
  </g>
  <rect x="326" y="478" width="706" height="44" rx="6" fill="#e2e8f0"/>
  <text x="679" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">No attention approximation: only the execution order and normalization bookkeeping change.</text>
</svg>
