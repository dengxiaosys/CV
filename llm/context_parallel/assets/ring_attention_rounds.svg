<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Four rounds of pass-KV Ring Attention</title>
  <desc id="desc">Each rank keeps its query shard fixed and receives a different KV shard in each round. After four rounds every query shard has attended to all KV shards.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1280" height="700" fill="#f8fafc"/>
  <text x="48" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Pass-KV Ring Attention: four ranks, four exact partial-attention rounds</text>
  <text x="48" y="82" font-family="Arial, sans-serif" font-size="17" fill="#475569">Q stays on its owner rank. KV rotates one hop per round. Compute overlaps with the next Send/Recv.</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">
    <text x="235" y="132" text-anchor="middle">round 0</text><text x="515" y="132" text-anchor="middle">round 1</text><text x="795" y="132" text-anchor="middle">round 2</text><text x="1075" y="132" text-anchor="middle">round 3</text>
    <text x="75" y="201">rank 0</text><text x="75" y="321">rank 1</text><text x="75" y="441">rank 2</text><text x="75" y="561">rank 3</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2"><path d="M375 144 V600"/><path d="M655 144 V600"/><path d="M935 144 V600"/></g>
  <g font-family="Arial, sans-serif" font-size="16">
    <g transform="translate(130,156)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#1e40af">Attn(Q0, KV0)</text><text x="105" y="57" text-anchor="middle" fill="#475569">local KV0</text></g>
    <g transform="translate(410,156)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#166534">Attn(Q0, KV3)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV3</text></g>
    <g transform="translate(690,156)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#92400e">Attn(Q0, KV2)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV2</text></g>
    <g transform="translate(970,156)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#991b1b">Attn(Q0, KV1)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV1</text></g>

    <g transform="translate(130,276)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#166534">Attn(Q1, KV1)</text><text x="105" y="57" text-anchor="middle" fill="#475569">local KV1</text></g>
    <g transform="translate(410,276)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#1e40af">Attn(Q1, KV0)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV0</text></g>
    <g transform="translate(690,276)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#991b1b">Attn(Q1, KV3)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV3</text></g>
    <g transform="translate(970,276)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#92400e">Attn(Q1, KV2)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV2</text></g>

    <g transform="translate(130,396)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#92400e">Attn(Q2, KV2)</text><text x="105" y="57" text-anchor="middle" fill="#475569">local KV2</text></g>
    <g transform="translate(410,396)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#166534">Attn(Q2, KV1)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV1</text></g>
    <g transform="translate(690,396)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#1e40af">Attn(Q2, KV0)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV0</text></g>
    <g transform="translate(970,396)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#991b1b">Attn(Q2, KV3)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV3</text></g>

    <g transform="translate(130,516)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#991b1b">Attn(Q3, KV3)</text><text x="105" y="57" text-anchor="middle" fill="#475569">local KV3</text></g>
    <g transform="translate(410,516)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#92400e">Attn(Q3, KV2)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV2</text></g>
    <g transform="translate(690,516)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#166534">Attn(Q3, KV1)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV1</text></g>
    <g transform="translate(970,516)"><rect width="210" height="78" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="105" y="29" text-anchor="middle" font-weight="700" fill="#1e40af">Attn(Q3, KV0)</text><text x="105" y="57" text-anchor="middle" fill="#475569">received KV0</text></g>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M340 245 H402"/><path d="M620 245 H682"/><path d="M900 245 H962"/><path d="M340 365 H402"/><path d="M620 365 H682"/><path d="M900 365 H962"/></g>
  <rect x="130" y="628" width="1050" height="44" rx="6" fill="#e2e8f0"/><text x="655" y="656" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">After N rounds: every local Q shard has seen every KV shard; merge partial outputs with online-softmax statistics.</text>
</svg>
