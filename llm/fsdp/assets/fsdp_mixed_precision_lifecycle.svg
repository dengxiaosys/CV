<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">FSDP mixed precision 的状态与通信 dtype 生命周期</title>
  <desc id="desc">区分常驻参数分片、计算期完整参数、activation、梯度归约和 optimizer state 的数据类型，并给出不同通信 dtype 下的字节量。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="#ffffff"/>
  <g font-family="'Source Han Sans SC', Arial, sans-serif" fill="#0f172a">
    <text x="64" y="62" font-size="32" font-weight="700">Mixed precision：不要把“参数精度”当成一个 dtype</text>
    <text x="64" y="100" font-size="18" fill="#475569">常驻 shard、All-Gather payload、算子输入、activation、Reduce-Scatter payload 和 optimizer state 可以采用不同精度。</text>

    <g transform="translate(64 146)">
      <rect x="0" y="0" width="1472" height="128" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
      <text x="28" y="40" font-size="23" font-weight="700" fill="#1e40af">稳定状态：全精度 parameter shard + 全精度 optimizer-state shard</text>
      <text x="28" y="70" font-size="16" fill="#1e40af">常见配置中，权威参数与 optimizer state 保持 FP32；低精度只在参数物化和计算窗口中出现。</text>
      <g transform="translate(970 24)" font-size="16" font-weight="700">
        <rect x="0" y="0" width="196" height="70" rx="6" fill="#dbeafe" stroke="#2563eb"/>
        <text x="98" y="30" text-anchor="middle">parameter shard</text>
        <text x="98" y="54" text-anchor="middle" font-size="14" fill="#1e40af">d_store，例如 FP32</text>
        <rect x="216" y="0" width="238" height="70" rx="6" fill="#dbeafe" stroke="#2563eb"/>
        <text x="335" y="30" text-anchor="middle">optimizer-state shard</text>
        <text x="335" y="54" text-anchor="middle" font-size="14" fill="#1e40af">d_opt，例如 FP32</text>
      </g>
    </g>

    <g transform="translate(64 318)">
      <line x1="72" y1="104" x2="1406" y2="104" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(88 22)">
        <rect x="0" y="0" width="222" height="164" rx="8" fill="#fef3c7" stroke="#d97706"/>
        <text x="111" y="34" text-anchor="middle" font-size="20" font-weight="700">Cast + All-Gather</text>
        <text x="111" y="68" text-anchor="middle" font-size="16">local shard</text>
        <text x="111" y="94" text-anchor="middle" font-size="22" font-weight="700">→ full parameter</text>
        <text x="111" y="126" text-anchor="middle" font-size="15" fill="#92400e">payload dtype = d_param</text>
        <text x="111" y="149" text-anchor="middle" font-size="14" fill="#92400e">例如 BF16</text>
      </g>

      <g transform="translate(350 22)">
        <rect x="0" y="0" width="222" height="164" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="111" y="34" text-anchor="middle" font-size="20" font-weight="700">Forward / backward</text>
        <text x="111" y="68" text-anchor="middle" font-size="16">parameter: d_param</text>
        <text x="111" y="94" text-anchor="middle" font-size="16">activation: d_act</text>
        <text x="111" y="120" text-anchor="middle" font-size="16">部分归约算子: FP32</text>
        <text x="111" y="146" text-anchor="middle" font-size="14" fill="#5b21b6">算子可按数值需求选 dtype</text>
      </g>

      <g transform="translate(612 22)">
        <rect x="0" y="0" width="222" height="164" rx="8" fill="#fee2e2" stroke="#dc2626"/>
        <text x="111" y="34" text-anchor="middle" font-size="20" font-weight="700">Local full gradient</text>
        <text x="111" y="70" text-anchor="middle" font-size="16">由当前 unit backward 产生</text>
        <text x="111" y="100" text-anchor="middle" font-size="16">进入归约前可 cast</text>
        <text x="111" y="132" text-anchor="middle" font-size="15" fill="#991b1b">短暂完整驻留</text>
      </g>

      <g transform="translate(874 22)">
        <rect x="0" y="0" width="222" height="164" rx="8" fill="#dcfce7" stroke="#16a34a"/>
        <text x="111" y="34" text-anchor="middle" font-size="20" font-weight="700">Reduce-Scatter</text>
        <text x="111" y="70" text-anchor="middle" font-size="16">reduction dtype = d_reduce</text>
        <text x="111" y="98" text-anchor="middle" font-size="16">可与 d_param 不同</text>
        <text x="111" y="130" text-anchor="middle" font-size="15" fill="#166534">例如 FP32 归约</text>
      </g>

      <g transform="translate(1136 22)">
        <rect x="0" y="0" width="246" height="164" rx="8" fill="#dbeafe" stroke="#2563eb"/>
        <text x="123" y="34" text-anchor="middle" font-size="20" font-weight="700">Local optimizer step</text>
        <text x="123" y="68" text-anchor="middle" font-size="16">gradient shard</text>
        <text x="123" y="94" text-anchor="middle" font-size="16">parameter shard</text>
        <text x="123" y="120" text-anchor="middle" font-size="16">optimizer-state shard</text>
        <text x="123" y="146" text-anchor="middle" font-size="14" fill="#1e40af">通常在 FP32 中更新</text>
      </g>
    </g>

    <g transform="translate(64 548)">
      <rect x="0" y="0" width="1472" height="116" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="28" y="36" font-size="21" font-weight="700">Stage 3 每 rank 的参数/梯度通信字节量</text>
      <text x="28" y="72" font-size="19" fill="#334155">V_step ≈ 2 c_N Ψ b_param + c_N Ψ b_reduce</text>
      <text x="620" y="72" font-size="16" fill="#64748b">两次参数 All-Gather 使用 b_param；一次梯度 Reduce-Scatter 使用 b_reduce。</text>
      <text x="28" y="99" font-size="15" fill="#64748b">只有 b_param = b_reduce 时，才能简写为 3 c_N S_theta；按字节分析时不能把不同 dtype 的 payload 混成同一个 S_theta。</text>
    </g>

    <g transform="translate(64 700)">
      <rect x="0" y="0" width="1472" height="82" rx="8" fill="#fff7ed" stroke="#fb923c"/>
      <text x="28" y="33" font-size="18" font-weight="700" fill="#9a3412">数值与性能权衡</text>
      <text x="28" y="60" font-size="16" fill="#9a3412">BF16 通常不需要 loss scaling；FP16 的动态范围更窄，常配合 gradient scaling。低精度通信减少字节数，但梯度归约精度可能直接影响收敛。</text>
    </g>
  </g>
</svg>
