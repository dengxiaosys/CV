<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Transactional KV-cache update during speculative decoding</title>
  <desc id="desc">A committed prefix is extended with four speculative tokens. The target accepts two, rejects the third, discards all target cache entries after the accepted prefix, emits a corrected token, and synchronizes the draft state before the next iteration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="48" y="52" font-size="30" font-weight="700" fill="#0f172a">Speculative KV cache behaves like a transaction</text>
    <text x="48" y="84" font-size="17" fill="#475569">Only KV entries on the accepted target-model path may become persistent state.</text>

    <rect x="48" y="118" width="1184" height="146" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="74" y="153" font-size="20" font-weight="700" fill="#334155">1. Stable prefix before the iteration</text>
    <g text-anchor="middle">
      <rect x="82" y="180" width="122" height="54" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="218" y="180" width="122" height="54" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="354" y="180" width="122" height="54" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="490" y="180" width="122" height="54" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <text x="143" y="212" font-size="15" font-weight="700" fill="#1e40af">KV[t-3]</text>
      <text x="279" y="212" font-size="15" font-weight="700" fill="#1e40af">KV[t-2]</text>
      <text x="415" y="212" font-size="15" font-weight="700" fill="#1e40af">KV[t-1]</text>
      <text x="551" y="212" font-size="15" font-weight="700" fill="#1e40af">KV[t]</text>
    </g>
    <text x="652" y="201" font-size="16" font-weight="700" fill="#1e40af">Committed target cache</text>
    <text x="652" y="228" font-size="15" fill="#475569">Shared prefix for target and synchronized draft state</text>

    <path d="M640 264V300" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="48" y="312" width="1184" height="180" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="74" y="347" font-size="20" font-weight="700" fill="#92400e">2. Draft four tokens and verify them in one target pass</text>
    <g text-anchor="middle">
      <rect x="82" y="380" width="122" height="72" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="218" y="380" width="122" height="72" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="354" y="380" width="122" height="72" rx="5" fill="#fee2e2" stroke="#dc2626"/>
      <rect x="490" y="380" width="122" height="72" rx="5" fill="#e2e8f0" stroke="#64748b"/>
      <text x="143" y="407" font-size="15" font-weight="700" fill="#166534">d1 accepted</text>
      <text x="143" y="433" font-size="14" fill="#334155">target KV valid</text>
      <text x="279" y="407" font-size="15" font-weight="700" fill="#166534">d2 accepted</text>
      <text x="279" y="433" font-size="14" fill="#334155">target KV valid</text>
      <text x="415" y="407" font-size="15" font-weight="700" fill="#991b1b">d3 rejected</text>
      <text x="415" y="433" font-size="14" fill="#334155">target KV invalid</text>
      <text x="551" y="407" font-size="15" font-weight="700" fill="#475569">d4 unneeded</text>
      <text x="551" y="433" font-size="14" fill="#334155">wrong prefix</text>
    </g>
    <rect x="674" y="374" width="514" height="84" rx="6" fill="#fef3c7"/>
    <text x="698" y="403" font-size="16" font-weight="700" fill="#92400e">First rejection determines the commit boundary</text>
    <text x="698" y="430" font-size="15" fill="#334155">Later draft tokens were conditioned on d3, so they cannot survive.</text>

    <path d="M640 492V528" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="48" y="540" width="1184" height="156" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="74" y="575" font-size="20" font-weight="700" fill="#1e40af">3. Commit the valid prefix, roll back the suffix, append correction c3</text>
    <g text-anchor="middle">
      <rect x="82" y="608" width="122" height="54" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="218" y="608" width="122" height="54" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="354" y="608" width="122" height="54" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="490" y="608" width="122" height="54" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="626" y="608" width="122" height="54" rx="5" fill="#fef3c7" stroke="#d97706"/>
      <text x="143" y="640" font-size="14" font-weight="700" fill="#1e40af">prefix ...</text>
      <text x="279" y="640" font-size="14" font-weight="700" fill="#1e40af">KV[t]</text>
      <text x="415" y="640" font-size="14" font-weight="700" fill="#166534">KV[d1]</text>
      <text x="551" y="640" font-size="14" font-weight="700" fill="#166534">KV[d2]</text>
      <text x="687" y="632" font-size="14" font-weight="700" fill="#92400e">token c3</text>
      <text x="687" y="651" font-size="12" fill="#334155">KV next pass</text>
    </g>
    <text x="790" y="619" font-size="15" font-weight="700" fill="#991b1b">Discard target KV[d3], KV[d4]</text>
    <text x="790" y="646" font-size="15" fill="#334155">Rollback/replay draft cache so its history ends in c3.</text>
    <text x="790" y="673" font-size="15" fill="#475569">Paged caches can free or remap blocks instead of copying tensors.</text>

    <text x="48" y="733" font-size="15" font-weight="700" fill="#0f172a">A token ID may be emitted before its KV exists; the next model call can materialize that KV, just as in ordinary autoregressive decoding.</text>
  </g>
</svg>
