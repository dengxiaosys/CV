<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Paged KV Cache 的逻辑块、物理块与共享前缀</title>
  <desc id="desc">两个序列的逻辑 block table 映射到非连续 HBM 物理 block；相同完整前缀通过链式哈希共享 block，并由引用计数保护。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <g font-family="'Source Han Sans SC', Arial, sans-serif" fill="#0f172a">
    <text x="64" y="62" font-size="32" font-weight="700">Paged KV Cache：逻辑连续，物理离散，完整前缀可共享</text>
    <text x="64" y="100" font-size="18" fill="#475569">block table 完成地址翻译；slot mapping 把新 token 写入物理 block 内的精确位置。</text>

    <g transform="translate(64 142)">
      <rect x="0" y="0" width="920" height="454" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="28" y="42" font-size="22" font-weight="700">逻辑序列与 block table</text>

      <text x="28" y="94" font-size="18" font-weight="700" fill="#1e40af">Sequence A</text>
      <g transform="translate(160 66)">
        <rect x="0" y="0" width="140" height="64" rx="6" fill="#dbeafe" stroke="#2563eb"/>
        <text x="70" y="27" text-anchor="middle" font-size="15" font-weight="700">logical 0</text>
        <text x="70" y="49" text-anchor="middle" font-size="13">tokens 0…B-1</text>
        <rect x="154" y="0" width="140" height="64" rx="6" fill="#dbeafe" stroke="#2563eb"/>
        <text x="224" y="27" text-anchor="middle" font-size="15" font-weight="700">logical 1</text>
        <text x="224" y="49" text-anchor="middle" font-size="13">tokens B…2B-1</text>
        <rect x="308" y="0" width="140" height="64" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="378" y="27" text-anchor="middle" font-size="15" font-weight="700">logical 2</text>
        <text x="378" y="49" text-anchor="middle" font-size="13">A suffix</text>
        <rect x="462" y="0" width="140" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 5"/>
        <text x="532" y="27" text-anchor="middle" font-size="15" font-weight="700">logical 3</text>
        <text x="532" y="49" text-anchor="middle" font-size="13">未填满</text>
      </g>
      <rect x="160" y="148" width="602" height="48" rx="6" fill="#ffffff" stroke="#64748b"/>
      <text x="180" y="178" font-size="15" font-weight="700">A.block_table = [7, 2, 9, 4]</text>

      <text x="28" y="258" font-size="18" font-weight="700" fill="#166534">Sequence B</text>
      <g transform="translate(160 230)">
        <rect x="0" y="0" width="140" height="64" rx="6" fill="#dbeafe" stroke="#2563eb"/>
        <text x="70" y="27" text-anchor="middle" font-size="15" font-weight="700">logical 0</text>
        <text x="70" y="49" text-anchor="middle" font-size="13">same prefix</text>
        <rect x="154" y="0" width="140" height="64" rx="6" fill="#dbeafe" stroke="#2563eb"/>
        <text x="224" y="27" text-anchor="middle" font-size="15" font-weight="700">logical 1</text>
        <text x="224" y="49" text-anchor="middle" font-size="13">same prefix</text>
        <rect x="308" y="0" width="140" height="64" rx="6" fill="#dcfce7" stroke="#16a34a"/>
        <text x="378" y="27" text-anchor="middle" font-size="15" font-weight="700">logical 2</text>
        <text x="378" y="49" text-anchor="middle" font-size="13">B suffix</text>
      </g>
      <rect x="160" y="312" width="448" height="48" rx="6" fill="#ffffff" stroke="#64748b"/>
      <text x="180" y="342" font-size="15" font-weight="700">B.block_table = [7, 2, 5]</text>

      <rect x="28" y="390" width="864" height="42" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
      <text x="460" y="417" text-anchor="middle" font-size="15" fill="#1e40af">逻辑位置按 token 顺序连续；物理 block ID 可以任意排列，两个序列也可以指向同一个 block。</text>
    </g>

    <g transform="translate(1028 142)">
      <rect x="0" y="0" width="508" height="454" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="28" y="42" font-size="22" font-weight="700" fill="#9a3412">HBM 物理 block 池</text>
      <text x="28" y="70" font-size="14" fill="#9a3412">每个方格覆盖所有层中 B 个 token 的 K/V</text>

      <g transform="translate(28 98)" font-size="14" font-weight="700">
        <rect x="0" y="0" width="92" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="46" y="31" text-anchor="middle">block 0</text>
        <text x="46" y="54" text-anchor="middle" fill="#64748b">free</text>
        <rect x="106" y="0" width="92" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="152" y="31" text-anchor="middle">block 1</text>
        <text x="152" y="54" text-anchor="middle" fill="#64748b">free</text>
        <rect x="212" y="0" width="92" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
        <text x="258" y="27" text-anchor="middle">block 2</text>
        <text x="258" y="50" text-anchor="middle" fill="#1d4ed8">prefix 1</text>
        <text x="258" y="67" text-anchor="middle" font-size="12" fill="#1d4ed8">ref = 2</text>
        <rect x="318" y="0" width="92" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="364" y="31" text-anchor="middle">block 3</text>
        <text x="364" y="54" text-anchor="middle" fill="#64748b">free</text>

        <rect x="0" y="92" width="92" height="72" rx="6" fill="#ffffff" stroke="#64748b" stroke-dasharray="7 5"/>
        <text x="46" y="119" text-anchor="middle">block 4</text>
        <text x="46" y="142" text-anchor="middle" fill="#475569">A partial</text>
        <rect x="106" y="92" width="92" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
        <text x="152" y="119" text-anchor="middle">block 5</text>
        <text x="152" y="142" text-anchor="middle" fill="#166534">B suffix</text>
        <rect x="212" y="92" width="92" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="258" y="123" text-anchor="middle">block 6</text>
        <text x="258" y="146" text-anchor="middle" fill="#64748b">free</text>
        <rect x="318" y="92" width="92" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
        <text x="364" y="119" text-anchor="middle">block 7</text>
        <text x="364" y="142" text-anchor="middle" fill="#1d4ed8">prefix 0</text>
        <text x="364" y="159" text-anchor="middle" font-size="12" fill="#1d4ed8">ref = 2</text>

        <rect x="0" y="184" width="92" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="46" y="215" text-anchor="middle">block 8</text>
        <text x="46" y="238" text-anchor="middle" fill="#64748b">free</text>
        <rect x="106" y="184" width="92" height="72" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="152" y="215" text-anchor="middle">block 9</text>
        <text x="152" y="238" text-anchor="middle" fill="#6b21a8">A suffix</text>
        <rect x="212" y="184" width="92" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="258" y="215" text-anchor="middle">block 10</text>
        <text x="258" y="238" text-anchor="middle" fill="#64748b">free</text>
        <rect x="318" y="184" width="92" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="364" y="215" text-anchor="middle">block 11</text>
        <text x="364" y="238" text-anchor="middle" fill="#64748b">free</text>
      </g>

      <rect x="28" y="382" width="452" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
      <text x="254" y="410" text-anchor="middle" font-size="14" fill="#92400e">相同大小消除外部碎片；尾 block 最多浪费 B-1 个 slot。</text>
    </g>

    <path d="M826 290 C942 290, 922 272, 1242 272" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <path d="M826 454 C958 454, 926 272, 1242 272" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <text x="1000" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">共享 block 7 / 2</text>

    <g transform="translate(64 636)">
      <rect x="0" y="0" width="1472" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="28" y="42" font-size="22" font-weight="700">完整 block 的 prefix identity：链式哈希 + 精确校验</text>

      <g transform="translate(44 78)">
        <rect x="0" y="0" width="286" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
        <text x="143" y="31" text-anchor="middle" font-size="16" font-weight="700">h0 = H(tokens[0:B])</text>
        <text x="143" y="57" text-anchor="middle" font-size="14" fill="#1d4ed8">第一个完整 block</text>
        <line x1="294" y1="38" x2="356" y2="38" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="364" y="0" width="346" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
        <text x="537" y="31" text-anchor="middle" font-size="16" font-weight="700">h1 = H(h0 || tokens[B:2B])</text>
        <text x="537" y="57" text-anchor="middle" font-size="14" fill="#1d4ed8">内容相同但前缀不同，也不会误共享</text>
        <line x1="718" y1="38" x2="780" y2="38" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="788" y="0" width="290" height="76" rx="8" fill="#fef3c7" stroke="#d97706"/>
        <text x="933" y="31" text-anchor="middle" font-size="16" font-weight="700">hash → block ID</text>
        <text x="933" y="57" text-anchor="middle" font-size="14" fill="#92400e">平均 O(1) 候选查找</text>
        <line x1="1086" y1="38" x2="1148" y2="38" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="1156" y="0" width="228" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
        <text x="1270" y="31" text-anchor="middle" font-size="16" font-weight="700">token IDs 精确相等</text>
        <text x="1270" y="57" text-anchor="middle" font-size="14" fill="#166534">才确认命中</text>
      </g>

      <g transform="translate(44 178)">
        <rect x="0" y="0" width="664" height="54" rx="8" fill="#f0fdf4" stroke="#86efac"/>
        <text x="332" y="33" text-anchor="middle" font-size="15" fill="#166534">命中后 ref_count + 1；任一请求结束只减引用，最后一个引用离开后才回到 free pool。</text>
        <rect x="728" y="0" width="656" height="54" rx="8" fill="#fff7ed" stroke="#fb923c"/>
        <text x="1056" y="33" text-anchor="middle" font-size="15" fill="#9a3412">不完整 block 持续增长，不注册 prefix hash；它只能由当前请求独占，填满后才成为缓存候选。</text>
      </g>
    </g>

    <text x="800" y="950" text-anchor="middle" font-size="16" fill="#475569">地址公式：physical slot = block_table[logical_block] × B + offset；注意力内核据此读取离散 KV pages。</text>
  </g>
</svg>
