<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Expert load imbalance and redundant expert placement</title>
  <desc id="desc">A static expert placement leaves one rank overloaded by a hot expert. Replicating that expert and redirecting part of its token traffic reduces the maximum rank load, which determines layer latency.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="820" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="54" y="58" font-size="30" font-weight="700" fill="#0f172a">Why average expert load is not enough</text>
    <text x="54" y="91" font-size="17" fill="#475569">The MoE layer waits for the slowest EP rank; placement and redundant experts target the maximum load.</text>

    <g filter="url(#shadow)">
      <rect x="54" y="132" width="614" height="586" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
      <rect x="772" y="132" width="614" height="586" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    </g>

    <text x="82" y="176" font-size="22" font-weight="700" fill="#991b1b">Static placement</text>
    <text x="800" y="176" font-size="22" font-weight="700" fill="#166534">Load-aware redundant placement</text>
    <text x="82" y="205" font-size="15" fill="#475569">E3 becomes hot for the current workload.</text>
    <text x="800" y="205" font-size="15" fill="#475569">A second physical copy of logical expert E3 shares its traffic.</text>

    <g>
      <line x1="116" y1="624" x2="620" y2="624" stroke="#64748b" stroke-width="2"/>
      <line x1="116" y1="256" x2="116" y2="624" stroke="#64748b" stroke-width="2"/>
      <text x="92" y="630" text-anchor="end" font-size="14" fill="#475569">0</text>
      <text x="92" y="538" text-anchor="end" font-size="14" fill="#475569">25</text>
      <text x="92" y="446" text-anchor="end" font-size="14" fill="#475569">50</text>
      <text x="92" y="354" text-anchor="end" font-size="14" fill="#475569">75</text>
      <text x="92" y="262" text-anchor="end" font-size="14" fill="#475569">100</text>
      <g text-anchor="middle" font-size="14" font-weight="700">
        <rect x="150" y="506" width="78" height="118" fill="#60a5fa"/>
        <text x="189" y="650" fill="#334155">rank 0</text><text x="189" y="496" fill="#1e3a8a">32</text>
        <rect x="270" y="278" width="78" height="346" fill="#f87171"/>
        <text x="309" y="650" fill="#334155">rank 1</text><text x="309" y="268" fill="#991b1b">94</text>
        <rect x="390" y="495" width="78" height="129" fill="#fbbf24"/>
        <text x="429" y="650" fill="#334155">rank 2</text><text x="429" y="485" fill="#92400e">35</text>
        <rect x="510" y="484" width="78" height="140" fill="#4ade80"/>
        <text x="549" y="650" fill="#334155">rank 3</text><text x="549" y="474" fill="#166534">38</text>
      </g>
      <rect x="255" y="226" width="108" height="32" rx="4" fill="#fee2e2" stroke="#dc2626"/>
      <text x="309" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">hot E3 owner</text>
    </g>

    <path d="M686 411H752" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="719" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">replicate</text>
    <text x="719" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">and reroute</text>

    <g>
      <line x1="834" y1="624" x2="1338" y2="624" stroke="#64748b" stroke-width="2"/>
      <line x1="834" y1="256" x2="834" y2="624" stroke="#64748b" stroke-width="2"/>
      <text x="810" y="630" text-anchor="end" font-size="14" fill="#475569">0</text>
      <text x="810" y="538" text-anchor="end" font-size="14" fill="#475569">25</text>
      <text x="810" y="446" text-anchor="end" font-size="14" fill="#475569">50</text>
      <text x="810" y="354" text-anchor="end" font-size="14" fill="#475569">75</text>
      <text x="810" y="262" text-anchor="end" font-size="14" fill="#475569">100</text>
      <g text-anchor="middle" font-size="14" font-weight="700">
        <rect x="868" y="458" width="78" height="166" fill="#60a5fa"/>
        <text x="907" y="650" fill="#334155">rank 0</text><text x="907" y="448" fill="#1e3a8a">45</text>
        <rect x="988" y="425" width="78" height="199" fill="#f87171"/>
        <text x="1027" y="650" fill="#334155">rank 1</text><text x="1027" y="415" fill="#991b1b">54</text>
        <rect x="1108" y="436" width="78" height="188" fill="#fbbf24"/>
        <text x="1147" y="650" fill="#334155">rank 2</text><text x="1147" y="426" fill="#92400e">51</text>
        <rect x="1228" y="443" width="78" height="181" fill="#4ade80"/>
        <text x="1267" y="650" fill="#334155">rank 3</text><text x="1267" y="433" fill="#166534">49</text>
      </g>
      <rect x="856" y="260" width="176" height="64" rx="5" fill="#ecfdf5" stroke="#16a34a"/>
      <text x="944" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">logical E3</text>
      <text x="944" y="308" text-anchor="middle" font-size="14" fill="#334155">original on rank 1</text>
      <rect x="1140" y="260" width="176" height="64" rx="5" fill="#ecfdf5" stroke="#16a34a"/>
      <text x="1228" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">logical E3</text>
      <text x="1228" y="308" text-anchor="middle" font-size="14" fill="#334155">redundant copy on rank 3</text>
      <path d="M1038 292H1126" stroke="#15803d" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    </g>

    <rect x="54" y="750" width="1332" height="40" rx="6" fill="#e2e8f0"/>
    <text x="78" y="776" font-size="15" fill="#0f172a"><tspan font-weight="700">Illustrative counts only:</tspan> total routed work stays constant; extra expert copies consume weight memory but can reduce the slowest-rank time.</text>
  </g>
</svg>
