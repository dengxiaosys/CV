<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Overlapping parallel views for attention and MoE layers</title>
  <desc id="desc">The same eight GPUs form four tensor-parallel attention groups and one eight-way expert-parallel group. Attention weights are replicated across data-parallel groups while routed expert weights are sharded over all ranks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="820" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="54" y="58" font-size="30" font-weight="700" fill="#0f172a">One physical cluster, two overlapping parallel views</text>
    <text x="54" y="91" font-size="17" fill="#475569">Example serving layout: 8 GPUs, attention TP = 2 and DP = 4, expert EP = 8.</text>

    <g filter="url(#shadow)">
      <rect x="54" y="132" width="1332" height="260" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <rect x="54" y="430" width="1332" height="300" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    </g>

    <text x="82" y="173" font-size="22" font-weight="700" fill="#1d4ed8">Attention view</text>
    <text x="82" y="202" font-size="15" fill="#475569">Four request/data groups; each group uses TP2 for attention and dense layers.</text>

    <g text-anchor="middle">
      <g>
        <rect x="82" y="230" width="286" height="126" rx="6" fill="#eff6ff" stroke="#2563eb"/>
        <text x="225" y="258" font-size="17" font-weight="700" fill="#1e40af">Attention DP group 0</text>
        <rect x="104" y="278" width="108" height="55" rx="4" fill="#dbeafe" stroke="#2563eb"/>
        <rect x="238" y="278" width="108" height="55" rx="4" fill="#dbeafe" stroke="#2563eb"/>
        <text x="158" y="312" font-size="15" font-weight="700" fill="#0f172a">GPU 0 / TP0</text>
        <text x="292" y="312" font-size="15" font-weight="700" fill="#0f172a">GPU 1 / TP1</text>
      </g>
      <g>
        <rect x="408" y="230" width="286" height="126" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
        <text x="551" y="258" font-size="17" font-weight="700" fill="#166534">Attention DP group 1</text>
        <rect x="430" y="278" width="108" height="55" rx="4" fill="#dcfce7" stroke="#16a34a"/>
        <rect x="564" y="278" width="108" height="55" rx="4" fill="#dcfce7" stroke="#16a34a"/>
        <text x="484" y="312" font-size="15" font-weight="700" fill="#0f172a">GPU 2 / TP0</text>
        <text x="618" y="312" font-size="15" font-weight="700" fill="#0f172a">GPU 3 / TP1</text>
      </g>
      <g>
        <rect x="734" y="230" width="286" height="126" rx="6" fill="#fffbeb" stroke="#d97706"/>
        <text x="877" y="258" font-size="17" font-weight="700" fill="#92400e">Attention DP group 2</text>
        <rect x="756" y="278" width="108" height="55" rx="4" fill="#fef3c7" stroke="#d97706"/>
        <rect x="890" y="278" width="108" height="55" rx="4" fill="#fef3c7" stroke="#d97706"/>
        <text x="810" y="312" font-size="15" font-weight="700" fill="#0f172a">GPU 4 / TP0</text>
        <text x="944" y="312" font-size="15" font-weight="700" fill="#0f172a">GPU 5 / TP1</text>
      </g>
      <g>
        <rect x="1060" y="230" width="286" height="126" rx="6" fill="#fff1f2" stroke="#dc2626"/>
        <text x="1203" y="258" font-size="17" font-weight="700" fill="#991b1b">Attention DP group 3</text>
        <rect x="1082" y="278" width="108" height="55" rx="4" fill="#fee2e2" stroke="#dc2626"/>
        <rect x="1216" y="278" width="108" height="55" rx="4" fill="#fee2e2" stroke="#dc2626"/>
        <text x="1136" y="312" font-size="15" font-weight="700" fill="#0f172a">GPU 6 / TP0</text>
        <text x="1270" y="312" font-size="15" font-weight="700" fill="#0f172a">GPU 7 / TP1</text>
      </g>
    </g>

    <path d="M720 392V418" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="742" y="411" font-size="14" font-weight="700" fill="#334155">same devices, next MoE layer</text>

    <text x="82" y="471" font-size="22" font-weight="700" fill="#6d28d9">Expert view</text>
    <text x="82" y="500" font-size="15" fill="#475569">One EP8 group spans all GPUs; routed expert weights are sharded, so requests cross former DP boundaries.</text>

    <g text-anchor="middle">
      <rect x="82" y="531" width="1264" height="154" rx="7" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
      <g font-size="15" font-weight="700">
        <rect x="102" y="560" width="135" height="82" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="169" y="588" fill="#5b21b6">GPU 0</text><text x="169" y="615" fill="#334155">E0-E3</text>
        <rect x="257" y="560" width="135" height="82" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="324" y="588" fill="#5b21b6">GPU 1</text><text x="324" y="615" fill="#334155">E4-E7</text>
        <rect x="412" y="560" width="135" height="82" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="479" y="588" fill="#5b21b6">GPU 2</text><text x="479" y="615" fill="#334155">E8-E11</text>
        <rect x="567" y="560" width="135" height="82" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="634" y="588" fill="#5b21b6">GPU 3</text><text x="634" y="615" fill="#334155">E12-E15</text>
        <rect x="722" y="560" width="135" height="82" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="789" y="588" fill="#5b21b6">GPU 4</text><text x="789" y="615" fill="#334155">E16-E19</text>
        <rect x="877" y="560" width="135" height="82" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="944" y="588" fill="#5b21b6">GPU 5</text><text x="944" y="615" fill="#334155">E20-E23</text>
        <rect x="1032" y="560" width="135" height="82" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="1099" y="588" fill="#5b21b6">GPU 6</text><text x="1099" y="615" fill="#334155">E24-E27</text>
        <rect x="1187" y="560" width="135" height="82" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="1254" y="588" fill="#5b21b6">GPU 7</text><text x="1254" y="615" fill="#334155">E28-E31</text>
      </g>
      <path d="M169 655C410 710 1030 710 1254 655" fill="none" stroke="#7c3aed" stroke-width="3"/>
      <path d="M1254 548C1010 505 410 505 169 548" fill="none" stroke="#7c3aed" stroke-width="3"/>
      <text x="712" y="675" font-size="14" font-weight="700" fill="#6d28d9">EP dispatch/combine can connect every rank</text>
    </g>

    <rect x="54" y="758" width="1332" height="38" rx="6" fill="#e2e8f0"/>
    <text x="76" y="783" font-size="15" fill="#0f172a"><tspan font-weight="700">Consequence:</tspan> “DP rank” does not necessarily mean an independent serving replica once expert layers use EP across those ranks.</text>
  </g>
</svg>
