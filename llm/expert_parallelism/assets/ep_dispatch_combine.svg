<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Expert parallel dispatch, expert computation, and combine</title>
  <desc id="desc">Tokens begin on their source ranks, a router selects top-k experts, an all-to-all dispatch moves token copies to expert owners, grouped GEMMs evaluate local experts, and an all-to-all combine returns weighted outputs to source ranks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#334155"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="820" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="54" y="58" font-size="30" font-weight="700" fill="#0f172a">One MoE layer under Expert Parallelism</text>
    <text x="54" y="91" font-size="17" fill="#475569">Token ownership is restored after two communication phases; expert weights stay on their owner ranks.</text>

    <g filter="url(#shadow)">
      <rect x="54" y="132" width="230" height="560" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <rect x="326" y="132" width="220" height="560" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <rect x="588" y="132" width="310" height="560" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <rect x="940" y="132" width="220" height="560" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
      <rect x="1202" y="132" width="184" height="560" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    </g>

    <g text-anchor="middle">
      <text x="169" y="172" font-size="20" font-weight="700" fill="#0f172a">Source ranks</text>
      <text x="436" y="172" font-size="20" font-weight="700" fill="#1d4ed8">Top-k router</text>
      <text x="743" y="172" font-size="20" font-weight="700" fill="#6d28d9">Expert owners</text>
      <text x="1050" y="172" font-size="20" font-weight="700" fill="#166534">Weighted combine</text>
      <text x="1294" y="172" font-size="20" font-weight="700" fill="#0f172a">Restored rows</text>
    </g>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="86" y="218" width="166" height="62" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <text x="169" y="244" fill="#1e3a8a">Rank 0 tokens</text>
      <text x="169" y="266" fill="#334155">x0  x1  x2</text>
      <rect x="86" y="309" width="166" height="62" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="169" y="335" fill="#166534">Rank 1 tokens</text>
      <text x="169" y="357" fill="#334155">x3  x4</text>
      <rect x="86" y="400" width="166" height="62" rx="5" fill="#fef3c7" stroke="#d97706"/>
      <text x="169" y="426" fill="#92400e">Rank 2 tokens</text>
      <text x="169" y="448" fill="#334155">x5  x6  x7</text>
      <rect x="86" y="491" width="166" height="62" rx="5" fill="#fee2e2" stroke="#dc2626"/>
      <text x="169" y="517" fill="#991b1b">Rank 3 tokens</text>
      <text x="169" y="539" fill="#334155">x8  x9</text>
    </g>

    <g text-anchor="middle">
      <rect x="354" y="220" width="164" height="108" rx="6" fill="#eff6ff" stroke="#2563eb"/>
      <text x="436" y="250" font-size="16" font-weight="700" fill="#1e40af">scores = Wg x</text>
      <text x="436" y="278" font-size="15" fill="#334155">select expert IDs</text>
      <text x="436" y="303" font-size="15" fill="#334155">and routing weights</text>
      <rect x="354" y="367" width="164" height="138" rx="6" fill="#f1f5f9" stroke="#64748b"/>
      <text x="436" y="397" font-size="16" font-weight="700" fill="#0f172a">Pack by destination</text>
      <text x="436" y="425" font-size="15" fill="#334155">token row</text>
      <text x="436" y="449" font-size="15" fill="#334155">source index</text>
      <text x="436" y="473" font-size="15" fill="#334155">expert ID + weight</text>
    </g>

    <g>
      <rect x="619" y="214" width="248" height="88" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
      <text x="641" y="242" font-size="16" font-weight="700" fill="#5b21b6">EP rank 0</text>
      <text x="641" y="270" font-size="15" fill="#334155">Experts E0, E1</text>
      <text x="641" y="291" font-size="14" fill="#475569">grouped GEMM over received rows</text>
      <rect x="619" y="325" width="248" height="88" rx="6" fill="#ecfdf5" stroke="#15803d"/>
      <text x="641" y="353" font-size="16" font-weight="700" fill="#166534">EP rank 1</text>
      <text x="641" y="381" font-size="15" fill="#334155">Experts E2, E3</text>
      <text x="641" y="402" font-size="14" fill="#475569">different row count per expert</text>
      <rect x="619" y="436" width="248" height="88" rx="6" fill="#fffbeb" stroke="#d97706"/>
      <text x="641" y="464" font-size="16" font-weight="700" fill="#92400e">EP rank 2</text>
      <text x="641" y="492" font-size="15" fill="#334155">Experts E4, E5</text>
      <text x="641" y="513" font-size="14" fill="#475569">local weights never move</text>
      <rect x="619" y="547" width="248" height="88" rx="6" fill="#fff1f2" stroke="#dc2626"/>
      <text x="641" y="575" font-size="16" font-weight="700" fill="#991b1b">EP rank 3</text>
      <text x="641" y="603" font-size="15" fill="#334155">Experts E6, E7</text>
      <text x="641" y="624" font-size="14" fill="#475569">straggler if this rank is hottest</text>
    </g>

    <g text-anchor="middle">
      <rect x="968" y="233" width="164" height="117" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
      <text x="1050" y="263" font-size="16" font-weight="700" fill="#166534">Return by source</text>
      <text x="1050" y="291" font-size="15" fill="#334155">All-to-All combine</text>
      <text x="1050" y="317" font-size="15" fill="#334155">sum top-k outputs</text>
      <rect x="968" y="399" width="164" height="117" rx="6" fill="#f1f5f9" stroke="#64748b"/>
      <text x="1050" y="429" font-size="16" font-weight="700" fill="#0f172a">Inverse permutation</text>
      <text x="1050" y="457" font-size="15" fill="#334155">restore token order</text>
      <text x="1050" y="483" font-size="15" fill="#334155">preserve source owner</text>
    </g>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="1224" y="236" width="140" height="62" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <text x="1294" y="262" fill="#1e3a8a">Rank 0 output</text>
      <text x="1294" y="284" fill="#334155">y0  y1  y2</text>
      <rect x="1224" y="327" width="140" height="62" rx="5" fill="#dcfce7" stroke="#16a34a"/>
      <text x="1294" y="353" fill="#166534">Rank 1 output</text>
      <text x="1294" y="375" fill="#334155">y3  y4</text>
      <rect x="1224" y="418" width="140" height="62" rx="5" fill="#fef3c7" stroke="#d97706"/>
      <text x="1294" y="444" fill="#92400e">Rank 2 output</text>
      <text x="1294" y="466" fill="#334155">y5  y6  y7</text>
      <rect x="1224" y="509" width="140" height="62" rx="5" fill="#fee2e2" stroke="#dc2626"/>
      <text x="1294" y="535" fill="#991b1b">Rank 3 output</text>
      <text x="1294" y="557" fill="#334155">y8  y9</text>
    </g>

    <path d="M284 411H310" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M546 411H574" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
    <path d="M898 411H926" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
    <path d="M1160 411H1188" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="560" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8" transform="rotate(-90 560 391)">DISPATCH</text>
    <text x="912" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#166534" transform="rotate(-90 912 391)">COMBINE</text>

    <rect x="54" y="726" width="1332" height="58" rx="6" fill="#e2e8f0"/>
    <text x="78" y="750" font-size="15" font-weight="700" fill="#0f172a">Invariant:</text>
    <text x="150" y="750" font-size="15" fill="#334155">token rows move to expert owners; expert parameters do not move during the layer.</text>
    <text x="78" y="772" font-size="15" font-weight="700" fill="#0f172a">Critical path:</text>
    <text x="174" y="772" font-size="15" fill="#334155">router + pack + dispatch + slowest expert rank + combine + restore.</text>
  </g>
</svg>
