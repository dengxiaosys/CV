<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #17212b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #52606d; }
    .phase { font-size: 18px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .small { font-size: 12px; fill: #52606d; text-anchor: middle; }
    .note { font-size: 13px; fill: #374151; text-anchor: middle; }
  </style>

  <text x="40" y="38" class="title">Vocabulary-parallel tied embedding</text>
  <text x="40" y="62" class="subtitle">Each TP rank stores one vocabulary-row shard E_i and reuses it for input lookup and output projection.</text>

  <rect x="30" y="90" width="1140" height="235" rx="8" fill="#f5faf7" stroke="#86aa96" stroke-width="2"/>
  <text x="52" y="122" class="phase">Input path</text>

  <rect x="50" y="165" width="150" height="70" rx="6" fill="#e8edf1" stroke="#7d8992"/>
  <text x="125" y="193" class="label">token ids</text>
  <text x="125" y="215" class="small">replicated on TP ranks</text>

  <rect x="250" y="142" width="290" height="116" rx="6" fill="#dceef7" stroke="#3f7fa3"/>
  <text x="395" y="171" class="label">rank i: masked lookup</text>
  <text x="395" y="196" class="small">owns vocabulary rows in E_i</text>
  <text x="395" y="217" class="small">owned token -> E_i row</text>
  <text x="395" y="238" class="small">other token -> zero vector</text>

  <rect x="600" y="165" width="190" height="70" rx="6" fill="#f8d7da" stroke="#b84a54" stroke-width="2"/>
  <text x="695" y="193" class="label">all-reduce SUM</text>
  <text x="695" y="215" class="small">combine local lookups</text>

  <rect x="850" y="165" width="270" height="70" rx="6" fill="#e5f1e8" stroke="#4f8a62"/>
  <text x="985" y="193" class="label">H: token embeddings</text>
  <text x="985" y="215" class="small">replicated, shape (b, s, h)</text>

  <line x1="200" y1="200" x2="244" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="200" x2="594" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="200" x2="844" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="315" y="345" width="570" height="58" rx="7" fill="#fff4d6" stroke="#b78a19"/>
  <text x="600" y="369" class="label">one shared parameter shard E_i: (v / p, h)</text>
  <text x="600" y="390" class="small">lookup uses rows of E_i; output projection uses E_i^T</text>

  <rect x="30" y="430" width="1140" height="235" rx="8" fill="#f5f8fc" stroke="#809fbd" stroke-width="2"/>
  <text x="52" y="462" class="phase">Output and loss path</text>

  <rect x="50" y="505" width="150" height="70" rx="6" fill="#e5f1e8" stroke="#4f8a62"/>
  <text x="125" y="533" class="label">hidden states X</text>
  <text x="125" y="555" class="small">replicated, shape (m, h)</text>

  <rect x="250" y="482" width="290" height="116" rx="6" fill="#dceef7" stroke="#3f7fa3"/>
  <text x="395" y="511" class="label">rank i: local projection</text>
  <text x="395" y="536" class="small">L_i = X E_i^T</text>
  <text x="395" y="557" class="small">logits shard: (m, v / p)</text>
  <text x="395" y="578" class="small">no logits all-gather</text>

  <rect x="600" y="482" width="245" height="116" rx="6" fill="#f5d8b8" stroke="#bc681f"/>
  <text x="722" y="511" class="label">sharded softmax + CE</text>
  <text x="722" y="536" class="small">all-reduce global max</text>
  <text x="722" y="557" class="small">all-reduce exp sum</text>
  <text x="722" y="578" class="small">all-reduce target logit</text>

  <rect x="905" y="505" width="215" height="70" rx="6" fill="#ead5e0" stroke="#a6597b"/>
  <text x="1012" y="533" class="label">cross-entropy loss</text>
  <text x="1012" y="555" class="small">shape (m), then reduce</text>

  <line x1="200" y1="540" x2="244" y2="540" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="540" x2="594" y2="540" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="845" y1="540" x2="899" y2="540" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="697" class="note">Parameter, optimizer state, output GEMM, and logits activation are sharded by p; only required statistics are communicated.</text>
</svg>
