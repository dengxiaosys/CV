<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880">
  <defs>
    <style>
      .title { font: 700 30px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #526174; }
      .head { font: 700 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .text { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #405166; }
      .small { font: 400 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #526174; }
      .normal { fill: #dae8fc; stroke: #4f81bd; stroke-width: 2; }
      .wait { fill: #fff2cc; stroke: #c7a52f; stroke-width: 2; }
      .active { fill: #d5e8d4; stroke: #4f8a4f; stroke-width: 2; }
      .end { fill: #ffe6cc; stroke: #d48a3a; stroke-width: 2; }
      .hook { fill: #f0e6f6; stroke: #7c4d9e; stroke-width: 2; }
      .arrow { stroke: #405166; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .retry { stroke: #b65f2a; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowOrange); }
      .hookline { stroke: #7c4d9e; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrowPurple); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#405166"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b65f2a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c4d9e"/>
    </marker>
  </defs>

  <rect width="1400" height="880" fill="#ffffff"/>
  <text x="70" y="55" class="title">appeal_task Lifecycle: Wait, Execute, Callback, Hook</text>
  <text x="70" y="84" class="subtitle">Async waits are persisted; deadline and criticality decide whether failure blocks progress</text>

  <rect x="80" y="175" width="210" height="88" rx="8" class="normal"/>
  <text x="185" y="208" text-anchor="middle" class="head">CREATED</text>
  <text x="185" y="234" text-anchor="middle" class="text">created by ops.proceed</text>

  <rect x="370" y="120" width="250" height="90" rx="8" class="wait"/>
  <text x="495" y="153" text-anchor="middle" class="head">WAITING_PREREQUISITES</text>
  <text x="495" y="179" text-anchor="middle" class="text">task waits for required inputs</text>

  <rect x="370" y="270" width="250" height="90" rx="8" class="wait"/>
  <text x="495" y="303" text-anchor="middle" class="head">WAITING_DELAY</text>
  <text x="495" y="329" text-anchor="middle" class="text">task waits until runnable_after</text>

  <rect x="700" y="195" width="220" height="90" rx="8" class="active"/>
  <text x="810" y="228" text-anchor="middle" class="head">RUNNABLE</text>
  <text x="810" y="254" text-anchor="middle" class="text">all runnable conditions hold</text>

  <rect x="1010" y="195" width="220" height="90" rx="8" class="active"/>
  <text x="1120" y="228" text-anchor="middle" class="head">EXECUTING</text>
  <text x="1120" y="252" text-anchor="middle" class="text">handler runs</text>
  <text x="1120" y="273" text-anchor="middle" class="small">Framework holds record lock</text>

  <rect x="1010" y="390" width="220" height="96" rx="8" class="wait"/>
  <text x="1120" y="423" text-anchor="middle" class="head">WAITING_CALLBACK</text>
  <text x="1120" y="449" text-anchor="middle" class="text">task waits for callback</text>
  <text x="1120" y="471" text-anchor="middle" class="small">finished_at is still empty</text>

  <rect x="740" y="600" width="210" height="90" rx="8" class="end"/>
  <text x="845" y="628" text-anchor="middle" class="head">FAILED</text>
  <text x="845" y="653" text-anchor="middle" class="text">timeout or retries exhausted</text>
  <text x="845" y="675" text-anchor="middle" class="small">critical blocks / optional continues</text>

  <rect x="1050" y="600" width="210" height="90" rx="8" class="end"/>
  <text x="1155" y="633" text-anchor="middle" class="head">FINISHED</text>
  <text x="1155" y="659" text-anchor="middle" class="text">handler returned result</text>

  <rect x="160" y="525" width="420" height="195" rx="8" class="hook"/>
  <text x="370" y="559" text-anchor="middle" class="head">Lifecycle Hooks</text>
  <text x="190" y="594" class="text">before_execute</text>
  <text x="190" y="622" class="text">after_dispatched</text>
  <text x="190" y="650" class="text">after_callback_received</text>
  <text x="190" y="678" class="text">after_finished / after_failed</text>
  <text x="370" y="706" text-anchor="middle" class="small">own args/result/status/logs; failure isolated from main task</text>

  <path d="M290 205 L365 170" class="arrow"/>
  <path d="M290 235 L365 300" class="arrow"/>
  <path d="M620 165 C665 170,680 210,695 225" class="arrow"/>
  <path d="M620 315 C665 310,680 270,695 255" class="arrow"/>
  <path d="M920 240 L1005 240" class="arrow"/>
  <path d="M1120 285 L1120 385" class="arrow"/>
  <path d="M1120 486 L1145 595" class="arrow"/>
  <path d="M1060 285 C980 360,945 500,865 595" class="retry"/>
  <path d="M845 600 C760 520,720 400,790 290" class="retry"/>
  <text x="710" y="470" class="small">next_retry_at / wait_deadline_at</text>
  <text x="710" y="490" class="small">delayed MQ wakes trigger_record</text>

  <path d="M1010 240 C780 365,630 490,580 570" class="hookline"/>
  <path d="M1010 438 C780 500,650 565,580 620" class="hookline"/>
  <path d="M1050 645 C800 735,640 705,580 680" class="hookline"/>

  <rect x="80" y="770" width="1240" height="70" rx="8" fill="#f3f5f7" stroke="#8b99a8" stroke-width="1.5"/>
  <text x="700" y="798" text-anchor="middle" class="head">Task Waits; Framework Schedules</text>
  <text x="700" y="823" text-anchor="middle" class="text">Handler writes task state; Framework persists it and redispatches the record after wake-up</text>
</svg>
