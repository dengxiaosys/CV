<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 30px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #526174; }
      .band-title { font: 700 19px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .node-title { font: 700 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .node-text { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #405166; }
      .small { font: 400 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #526174; }
      .entry { fill: #dae8fc; stroke: #4f81bd; stroke-width: 2; }
      .core { fill: #d5e8d4; stroke: #4f8a4f; stroke-width: 2; }
      .ops { fill: #fff2cc; stroke: #c7a52f; stroke-width: 2; }
      .external { fill: #ffe6cc; stroke: #d48a3a; stroke-width: 2; }
      .runtime { fill: #f3f5f7; stroke: #8b99a8; stroke-width: 2; }
      .seam { stroke: #7c4d9e; stroke-width: 2; stroke-dasharray: 8 6; }
      .arrow { stroke: #405166; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .async { stroke: #b65f2a; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowOrange); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#405166"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b65f2a"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="55" class="title">Kernel-style Stateful Workflow Framework</text>
  <text x="70" y="84" class="subtitle">Small external interface, deep framework implementation, pluggable business ops</text>

  <rect x="70" y="120" width="1260" height="115" rx="8" class="entry"/>
  <text x="95" y="153" class="band-title">External Entry Module</text>
  <rect x="370" y="143" width="155" height="62" rx="6" fill="#ffffff" stroke="#4f81bd"/>
  <rect x="550" y="143" width="155" height="62" rx="6" fill="#ffffff" stroke="#4f81bd"/>
  <rect x="730" y="143" width="155" height="62" rx="6" fill="#ffffff" stroke="#4f81bd"/>
  <rect x="910" y="143" width="155" height="62" rx="6" fill="#ffffff" stroke="#4f81bd"/>
  <rect x="1090" y="143" width="155" height="62" rx="6" fill="#ffffff" stroke="#4f81bd"/>
  <text x="447" y="180" text-anchor="middle" class="node-title">submit</text>
  <text x="627" y="180" text-anchor="middle" class="node-title">callback</text>
  <text x="807" y="180" text-anchor="middle" class="node-title">revoke</text>
  <text x="987" y="180" text-anchor="middle" class="node-title">query</text>
  <text x="1167" y="180" text-anchor="middle" class="node-title">retry / trigger</text>

  <line x1="70" y1="270" x2="1330" y2="270" class="seam"/>
  <text x="80" y="262" class="small">External seam: protocol, auth, idempotency, fast acknowledgement</text>

  <rect x="70" y="300" width="1260" height="245" rx="8" class="core"/>
  <text x="95" y="335" class="band-title">Framework Kernel Module</text>

  <rect x="105" y="365" width="250" height="140" rx="7" fill="#ffffff" stroke="#4f8a4f"/>
  <text x="230" y="397" text-anchor="middle" class="node-title">Record Lifecycle</text>
  <text x="230" y="425" text-anchor="middle" class="node-text">load / snapshot / current</text>
  <text x="230" y="449" text-anchor="middle" class="node-text">lock / diff / writeback</text>
  <text x="230" y="473" text-anchor="middle" class="node-text">unified exit path</text>

  <rect x="390" y="365" width="250" height="140" rx="7" fill="#ffffff" stroke="#4f8a4f"/>
  <text x="515" y="397" text-anchor="middle" class="node-title">Workflow Scheduler</text>
  <text x="515" y="425" text-anchor="middle" class="node-text">cancel_check / proceed</text>
  <text x="515" y="449" text-anchor="middle" class="node-text">barrier / execute / retry</text>
  <text x="515" y="473" text-anchor="middle" class="node-text">trigger_record / async handoff</text>

  <rect x="675" y="365" width="250" height="140" rx="7" fill="#ffffff" stroke="#4f8a4f"/>
  <text x="800" y="397" text-anchor="middle" class="node-title">Async Runtime</text>
  <text x="800" y="425" text-anchor="middle" class="node-text">task wait state / callback dispatch</text>
  <text x="800" y="449" text-anchor="middle" class="node-text">runnable_after / delayed wake</text>
  <text x="800" y="473" text-anchor="middle" class="node-text">criticality / lifecycle hooks</text>

  <rect x="960" y="365" width="335" height="140" rx="7" fill="#ffffff" stroke="#4f8a4f"/>
  <text x="1127" y="397" text-anchor="middle" class="node-title">Governance / Observability</text>
  <text x="1127" y="425" text-anchor="middle" class="node-text">metrics / events / audit query</text>
  <text x="1127" y="449" text-anchor="middle" class="node-text">monitor rule / resource quota</text>
  <text x="1127" y="473" text-anchor="middle" class="node-text">error and log correlation</text>

  <line x1="70" y1="580" x2="1330" y2="580" class="seam"/>
  <text x="80" y="572" class="small">Business seam: scene + entity_type -&gt; appeal_ops</text>

  <rect x="70" y="610" width="1260" height="105" rx="8" class="ops"/>
  <text x="95" y="645" class="band-title">Business Ops / Adapter</text>
  <rect x="350" y="630" width="190" height="58" rx="6" fill="#ffffff" stroke="#c7a52f"/>
  <rect x="565" y="630" width="190" height="58" rx="6" fill="#ffffff" stroke="#c7a52f"/>
  <rect x="780" y="630" width="190" height="58" rx="6" fill="#ffffff" stroke="#c7a52f"/>
  <rect x="995" y="630" width="190" height="58" rx="6" fill="#ffffff" stroke="#c7a52f"/>
  <text x="445" y="665" text-anchor="middle" class="node-title">video ops</text>
  <text x="660" y="665" text-anchor="middle" class="node-title">account ops</text>
  <text x="875" y="665" text-anchor="middle" class="node-title">comment ops</text>
  <text x="1090" y="665" text-anchor="middle" class="node-title">device ops</text>

  <line x1="70" y1="750" x2="1330" y2="750" class="seam"/>
  <text x="80" y="742" class="small">Dependency seam: stable adapters isolate external differences</text>

  <rect x="70" y="780" width="1260" height="90" rx="8" class="external"/>
  <text x="95" y="813" class="band-title">External Dependencies</text>
  <text x="345" y="835" text-anchor="middle" class="node-title">Punish</text>
  <text x="575" y="835" text-anchor="middle" class="node-title">Review</text>
  <text x="805" y="835" text-anchor="middle" class="node-title">Notify</text>
  <text x="1035" y="835" text-anchor="middle" class="node-title">Rule / Risk / Profile</text>

  <path d="M700 235 L700 295" class="arrow"/>
  <path d="M700 545 L700 605" class="arrow"/>
  <path d="M700 715 L700 775" class="arrow"/>
  <path d="M1150 780 C1360 735,1360 260,1205 205" class="async"/>
  <text x="1368" y="505" transform="rotate(-90 1368 505)" class="small">callback / delayed event</text>
</svg>
